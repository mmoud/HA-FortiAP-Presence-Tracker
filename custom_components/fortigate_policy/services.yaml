set_policy_override:
  name: Set policy automation override
  description: Force, pause, or restore automatic control for one rule-managed policy.
  fields:
    config_entry_id:
      name: Config entry ID
      description: The FortiAP Presence Tracker config entry ID shown in diagnostics.
      required: true
      example: 01JEXAMPLE0000000000000000
      selector:
        text:
    policy_id:
      name: Policy ID
      description: A policy configured on this integration entry.
      required: true
      example: "61"
      selector:
        text:
    mode:
      name: Mode
      required: true
      selector:
        select:
          options:
            - automatic
            - force_enable
            - force_disable
            - paused
    duration_minutes:
      name: Duration
      description: Minutes before returning to Automatic. Zero lasts until changed or Home Assistant restarts. Uses the configured default when omitted.
      required: false
      selector:
        number:
          min: 0
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box
